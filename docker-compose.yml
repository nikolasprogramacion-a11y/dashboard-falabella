services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finart_falabella_dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      # Persistencia de datos de negocio y base de datos
      - ./datos:/app/datos
      - ./ventas.db:/app/ventas.db
      - ./logs:/app/logs
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
